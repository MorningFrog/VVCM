[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "VVCM"
version = "0.0.1"
description = "Use VVCM and stable forward kinematics to predict object position for multi-robot transportation system with a deformable sheet."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "MorningFrog", email = "1098224028@qq.com" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/MorningFrog/VVCM_cpp"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1

# Optional: run pytest to ensure that the package was correctly built
# test-command = "pytest {project}/tests"
# test-requires = "pytest"

# skip pypy wheels
skip = ["*musllinux*", "pp*", "cp38*", "cp39*", "cp310*", "cp311*", "cp312*"]

[tool.cibuildwheel.linux]
before-all = "bash cibuildwheel_scripts/before-all.linux.bash"
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.linux.environment]
VCPKG_ROOT = "/opt/vcpkg"
CMAKE_TOOLCHAIN_FILE = "/opt/vcpkg/scripts/buildsystems/vcpkg.cmake"

# Set for linux x64
[[tool.cibuildwheel.overrides]]
select = "*linux*x86_64*"
inherit.environment = "append"
environment = { VCPKG_TARGET_TRIPLET = "x64-linux" }

# Set for linux arm64
[[tool.cibuildwheel.overrides]]
select = "*linux*aarch64*"
inherit.environment = "append"
environment = { VCPKG_TARGET_TRIPLET = "arm64-linux" }

[tool.cibuildwheel.windows]
before-all = "powershell -ExecutionPolicy Bypass -File cibuildwheel_scripts/before-all.windows.ps1"
archs = ["AMD64", "ARM64"]

[tool.cibuildwheel.windows.environment]
VCPKG_ROOT = "C:/vcpkg"
CMAKE_TOOLCHAIN_FILE = "C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

# Set for windows x64
[[tool.cibuildwheel.overrides]]
select = "*win*amd64*"
inherit.environment = "append"
environment = { VCPKG_TARGET_TRIPLET = "x64-windows" }

# Set for windows arm64
[[tool.cibuildwheel.overrides]]
select = "*win*arm64*"
environment = { VCPKG_TARGET_TRIPLET = "arm64-windows", CMAKE_GENERATOR = "Ninja", CMAKE_GENERATOR_PLATFORM = "ARM64", CMAKE_PREFIX_PATH = "C:/vcpkg/installed/arm64-windows" }

[tool.cibuildwheel.macos]
before-all = "zsh cibuildwheel_scripts/before-all.macos.zsh"
archs = ["auto"]

[tool.cibuildwheel.macos.environment]
VCPKG_ROOT = "$HOME/vcpkg"
CMAKE_TOOLCHAIN_FILE = "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

## Needed for full C++17 support on macOS

# Set for macos x64
[[tool.cibuildwheel.overrides]]
select = "*macos*x86_64*"
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.14", VCPKG_TARGET_TRIPLET = "x64-osx" }

# Set for macos arm64
[[tool.cibuildwheel.overrides]]
select = "*macos*arm64*"
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", VCPKG_TARGET_TRIPLET = "arm64-osx" }
